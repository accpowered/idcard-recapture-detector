# 居民身份证翻拍识别工具 — 主配置
# 所有路径均相对仓库根目录。

app:
  host: 127.0.0.1
  port: 8000
  auto_open: true            # 启动后自动打开浏览器

pipeline:
  max_long_side: 1600        # 输入归一化：长边缩放上限
  card_size: [856, 540]      # 透视矫正后基准尺寸 (宽, 高)
  enable_orientation: false  # 方向分类未启用时跳过
  enable_unwarp: false       # UVDoc 形变矫正（可选，默认关闭）
  ocr:
    enabled: true            # OCR 是否启用（未安装 rapidocr 时自动降级并标注）
    fallback_to_v4: true     # PP-OCRv5 失败时降级 v4

recapture:
  # 识别模式：screen_only（仅屏幕翻拍）| screen_and_print（屏幕 + 打印翻拍）
  # 训练类别集合与推理行为都跟随该设置；切换时若当前模型不兼容会自动启用兼容版本。
  mode: screen_and_print
  # 融合权重：recapture_score = w_screen*P(screen) + w_print*P(print) + w_signal*signal_score
  fusion_weights: { w_screen: 0.45, w_print: 0.35, w_signal: 0.20 }
  # 风险分级：score < low 低风险(原件)；> high 高风险(疑似翻拍)；其间中风险(建议复核)
  thresholds: { low: 0.30, high: 0.60 }
  # 特征分类器权重（JSON，可由 tools/train_recapture.py 再训练覆盖）
  weights_path: models/recapture/weights.json

privacy:
  store_original: false      # 是否落盘原图（默认仅驻留内存）
  mask_fields: true          # 身份证号/姓名默认打码展示与落库
  log_id_number: false       # 日志中是否出现完整身份证号

storage:
  db_path: data/app.db
  feedback_dir: data/feedback
  history_limit: 5000

models:
  root: models
  checksums: models/checksums.json

# 界面：控制前端功能区的显示（可在 Web「设置」页修改并即时生效）
ui:
  show_training: true        # 是否显示「模型 → 再训练」区域

# 训练默认参数（可在 Web 端按次覆盖；min_macro_f1 / epochs / lr 为只读默认值）
training:
  epochs: 200
  lr: 0.5
  target_fpr: 0.05           # 阈值校准的目标假阳率
  keep_versions: 10          # 自动保留的模型版本数（基线 1.0.0 与当前版本始终保留）
  min_macro_f1: 0.5          # 质量门：低于该值的训练结果只保存为候选、不自动启用
